name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 */3 * *'  # cada 3 días a las 12:00 UTC
  workflow_dispatch:  # te permite ejecutarlo manualmente también

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project
        run: curl -s -o /dev/null -w "%{http_code}" https://nqdtvrgkzrnjojrwwqoy.supabase.co/rest/v1/
